name: Tooling or build problem
description: tools/*.py, CMake, the toolchain or CI misbehaves.
labels: ["tooling"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste key values, title keys or dumped game data.** Paths and
        build IDs are fine.
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: python tools/check.py _ZN4pkmn10GetVersionEv --diff
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full output, including the traceback if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, `toolchain/clang/bin/clang --version`.
      placeholder: Windows 11, Python 3.12, clang 7.0.1
    validations:
      required: true
