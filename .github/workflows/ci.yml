name: CI

# No game files are available here - CI only validates the data files and that
# the source tree compiles for both games. Matching is checked locally with
# tools/check.py (or on a self-hosted runner that has its own dump).
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/lint.py

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game: [sword, shield]
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + ninja
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.game }} -DPKMN_CLANG_ROOT=/usr
      - name: Build
        run: cmake --build --preset ${{ matrix.game }}
