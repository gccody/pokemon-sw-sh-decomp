name: CI

# No game files are available here. CI validates the data files, tests the
# Python tooling, checks formatting, and checks that the source tree compiles
# for both games. Matching is checked locally with tools/check.py, and the
# PR template asks for its output.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Data lint + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements*.txt
      - run: pip install -r tools/requirements-dev.txt
      - name: Validate CSVs and tracked files
        run: python tools/lint.py
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/requirements*.txt
      - run: pip install -r tools/requirements-dev.txt
      - run: python -m pytest

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install clang-format==19.1.7
      - name: Check formatting (fix locally with clang-format -i)
        run: git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror

  build:
    name: Build (${{ matrix.game }})
    # ubuntu-22.04, not ubuntu-latest: the only Linux x86-64 build of the
    # matching compiler (LLVM 7.0.1, built on Ubuntu 18.04) links against
    # libtinfo.so.5. 22.04 still packages it (libtinfo5); 24.04 dropped it, and
    # a libtinfo.so.5 -> libtinfo.so.6 symlink doesn't load: clang-7 needs
    # symbol version NCURSES_TINFO_5.0.19991023, which .so.6 only defines as
    # NCURSES6_TINFO_*. When GitHub retires 22.04, run this job in an
    # ubuntu:22.04 (or older) container instead.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        game: [sword, shield]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ninja + libtinfo5
        run: sudo apt-get update && sudo apt-get install -y ninja-build libtinfo5
      # Libraries built with another clang name it in CMakeLists.txt
      # (pkmn_library_settings(... COMPILER_VERSION <version>)). get_llvm.py
      # lists the versions whose library has sources, so they're named only
      # there. With none, this is just clang 7.0.1 and the key has no suffix.
      - name: Find library compilers
        id: compilers
        shell: bash
        run: |
          versions=$(python tools/get_llvm.py --list-library-compilers)
          echo "library compilers: ${versions:-none}"
          suffix="" paths="toolchain/clang"
          for v in $versions; do suffix+="+$v"; paths+=$'\n'"toolchain/clang-$v"; done
          echo "key-suffix=$suffix" >> "$GITHUB_OUTPUT"
          { echo "paths<<EOF"; echo "$paths"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Cache clang 7.0.1 and the library compilers
        id: cache-clang
        uses: actions/cache@v6
        with:
          path: ${{ steps.compilers.outputs.paths }}
          key: clang-7.0.1${{ steps.compilers.outputs.key-suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/get_llvm.py') }}
      - name: Install clang 7.0.1 and the library compilers
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: python tools/get_llvm.py --compiler --library-compilers
      # cmake/toolchain-nx64.cmake picks up toolchain/clang on its own, as it
      # does for contributors. Fail if that isn't clang 7.0.x.
      - name: Check compiler version
        shell: bash
        run: |
          ver=$(toolchain/clang/bin/clang++ --version)
          echo "$ver"
          [[ "$ver" =~ ^clang\ version\ 7\.0\.[0-9]+ ]] \
            || { echo "::error::toolchain/clang is not clang 7.0.x"; exit 1; }
      # lib/physx's files with v3.4.2's code aren't in the repository (they
      # aren't BSD-licensed). get_physx.py rebuilds them from NVIDIA's public
      # PhysX-3.4 repository and checks their SHA-256 (data/physx_v342.csv).
      - name: Cache the PhysX downloads
        uses: actions/cache@v6
        with:
          path: toolchain/physx
          key: physx-${{ hashFiles('data/physx_v342.csv', 'tools/get_physx.py') }}
      - name: Generate lib/physx's v3.4.2 files
        run: python tools/get_physx.py
      # The protoc 3.0.0 output for src/**/*.proto isn't in the repository (it
      # embeds the game's serialized descriptors). protos.py downloads Google's
      # protoc 3.0.0 release (SHA-256 pinned) and generates it.
      - name: Cache protoc 3.0.0
        uses: actions/cache@v6
        with:
          path: toolchain/protoc-3.0.0
          key: protoc-3.0.0-${{ runner.os }}-${{ hashFiles('tools/protos.py') }}
      - name: Generate the protobuf messages
        run: python tools/protos.py generate
      - name: Configure
        shell: bash  # -eo pipefail, so a failing cmake isn't hidden by tee
        run: |
          cmake --preset ${{ matrix.game }} | tee "$RUNNER_TEMP/configure.log"
          grep -Eq 'The CXX compiler identification is Clang 7\.0\.[0-9]+' "$RUNNER_TEMP/configure.log" \
            || { echo "::error::CMake did not pick clang 7.0.x"; exit 1; }
      - name: Build
        run: cmake --build --preset ${{ matrix.game }}
