# Tool configuration only - the Python tooling is not an installable package.
# Install dependencies with: pip install -r tools/requirements-dev.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["tools", "tests"]

[tool.ruff.lint]
# Correctness-focused: pyflakes, syntax/statement errors, bugbear.
# Formatting is not enforced; match the style of the file you are editing.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E702", # `a; b` on one line is used for short early-exit branches
    "B905", # zip() without strict=; lengths are checked where it matters
]
